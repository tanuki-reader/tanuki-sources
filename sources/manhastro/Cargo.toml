[package]
name = "tanuki-source-manhastro"
version = "0.1.0"
edition = "2021"
description = "Manhastro source for Tanuki — pt-BR, a plain JSON API with no signing or gate."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tanuki-source-api = { path = "../../source-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true