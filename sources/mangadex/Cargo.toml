[package]
name = "tanuki-source-mangadex"
version = "0.1.0"
edition = "2021"
description = "MangaDex source for Tanuki — the first source that fetches over the host http_request bridge."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tanuki-source-api = { path = "../../source-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
